# Нарезка снимка stipendii_lp_v1 по разделам из structure/.
# Параметры как у mdd_sections_512.yaml (этап D пайплайна стипендий).
strategy: md_header
embedding_model: BAAI/bge-m3
tokenizer: BAAI/bge-m3
max_tokens: 512
overlap_tokens: 64
min_tokens: 24
chunker: stipendii-sections+recursive/v1/512/64
embed_text: "{breadcrumbs}\n{title}\n{headings}\n\n{text}"
limits:
  max_html_bytes: 2000000
  max_file_bytes: 20000000
  max_pages: 100
